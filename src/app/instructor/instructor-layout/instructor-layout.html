<div class="app-container">
  <mat-sidenav-container class="sidenav-container" [class.sidebar-opened]="getSidebarOpenedClass()">

    <!-- ── Sidebar ── -->
    <mat-sidenav #sidenav [mode]="getSidenavMode()" [opened]="sidebarOpen()" class="mat-sidenav-custom">

      <!-- Logo -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">👨‍🏫</div>
          <div class="logo-text">
            <h3 class="logo-title">St. Binelde BASIC</h3>
            <p class="logo-subtitle">Instructor Portal</p>
          </div>
        </div>
      </div>

      <!-- User Info -->
      <div class="sidebar-user">
        <div class="user-avatar">{{ initials }}</div>
        <div class="user-details">
          <p class="user-name">{{ userName() }}</p>
          <p class="user-role">{{ userDept() || 'Faculty' }}</p>
          <p class="user-fid" *ngIf="facultyId()">{{ facultyId() }}</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="nav-menu">
        <p class="nav-section-label">ACADEMICS</p>
        <ul class="nav-links-list">
          <li>
            <a routerLink="/instructor/courses" routerLinkActive="active" class="nav-link" (click)="closeSidebarOnMobile()">
              <span class="nav-icon">📚</span>
              <span class="nav-label">My Courses</span>
            </a>
          </li>
          <li>
            <a routerLink="/instructor/grading" routerLinkActive="active" class="nav-link" (click)="closeSidebarOnMobile()">
              <span class="nav-icon">📝</span>
              <span class="nav-label">Grading System</span>
            </a>
          </li>
        </ul>

        <p class="nav-section-label">ACCOUNT</p>
        <ul class="nav-links-list">
          <li>
            <a routerLink="/instructor/profile" routerLinkActive="active" class="nav-link" (click)="closeSidebarOnMobile()">
              <span class="nav-icon">👤</span>
              <span class="nav-label">Profile</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Footer logout -->
      <div class="sidebar-footer">
        <button class="btn-logout-side" (click)="logout()">
          <span>🚪</span> Logout
        </button>
      </div>
    </mat-sidenav>

    <!-- ── Main Content ── -->
    <mat-sidenav-content>
      <header class="app-header">
        <button class="toggle-sidebar-icon" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <span class="hamburger"></span>
          <span class="hamburger"></span>
          <span class="hamburger"></span>
        </button>
        <div class="header-content">
          <h1 class="app-title">St. Binelde BASIC System</h1>
          <p class="header-subtitle">Instructor Management</p>
        </div>
        <div class="header-actions">
          <div class="header-user">
            <div class="h-avatar">{{ initials }}</div>
            <span class="h-name">{{ userName() }}</span>
          </div>
          <button class="btn-logout-header" (click)="logout()">🚪 Logout</button>
        </div>
      </header>
      <main class="main-content">
        <section class="content">
          <router-outlet></router-outlet>
        </section>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
