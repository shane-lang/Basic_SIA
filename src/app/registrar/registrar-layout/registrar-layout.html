<div class="app-container">
  <mat-sidenav-container class="sidenav-container" [class.sidebar-opened]="getSidebarOpenedClass()">

    <!-- ── Sidebar ── -->
    <mat-sidenav #sidenav [mode]="getSidenavMode()" [opened]="sidebarOpen()" class="mat-sidenav-custom">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">🎓</div>
          <div class="logo-text">
            <h3 class="logo-title">BASIC</h3>
            <p class="logo-subtitle">Registrar Portal</p>
          </div>
        </div>
      </div>

      <nav class="nav-menu">
        <ul class="nav-links-list">
          <li>
            <a routerLink="/registrar/tor-evaluation" routerLinkActive="active" class="nav-link" (click)="closeSidebarOnMobile()">
              <span class="nav-icon">📄</span>
              <span class="nav-label">TOR Evaluation</span>
            </a>
          </li>
          <!--<li>
          <!--<li>
            <a routerLink="/registrar/students" routerLinkActive="active" class="nav-link" (click)="closeSidebarOnMobile()">
              <span class="nav-icon">👥</span>
              <span class="nav-label">Students</span>
            </a>
          </li>-->
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">🎓</div>
          <div class="user-details">
            <p class="user-name">{{ userName() }}</p>
            <p class="user-role">{{ userRole() }}</p>
          </div>
        </div>
        <!--<button class="btn-logout" (click)="logout()">🚪 Logout</button>-->
      </div>
    </mat-sidenav>

    <!-- ── Main Content ── -->
    <mat-sidenav-content>
      <header class="app-header">
        <button class="toggle-sidebar-icon" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <span class="hamburger"></span>
          <span class="hamburger"></span>
          <span class="hamburger"></span>
        </button>
        <div class="header-content">
          <h1 class="app-title">St. Benilde BASIC System</h1>
          <p class="header-subtitle">Registrar's Office</p>
        </div>
        <div class="header-actions">
          <button class="btn-logout-header" (click)="logout()">🚪 Logout</button>
        </div>
      </header>
      <main class="main-content">
        <section class="content">
          <router-outlet></router-outlet>
        </section>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
