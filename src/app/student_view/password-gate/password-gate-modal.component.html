<!-- password-gate-modal.component.html -->
<div class="pg-overlay"
     (click)="onOverlayClick($event)"
     (keydown)="onKeydown($event)"
     tabindex="-1"
     role="dialog"
     aria-modal="true"
     [attr.aria-label]="'Verify password to view ' + documentLabel">

  <div class="pg-card" role="document">

    <!-- Header -->
    <div class="pg-header">
      <div class="pg-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div>
        <h2 class="pg-title">Password Required</h2>
        <p class="pg-subtitle">Enter your account password to view your <strong>{{ documentLabel }}</strong></p>
      </div>
      <button class="pg-close" (click)="dismiss()" aria-label="Close" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="pg-body">

      <!-- Error alert -->
      <div class="pg-error" *ngIf="errorMessage" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Password input -->
      <label class="pg-label" for="pg-password-input">Account Password</label>
      <div class="pg-input-wrap">
        <input
          id="pg-password-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          class="pg-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          autofocus
          [disabled]="isLoading"
          (keydown.enter)="submit()" />

        <button class="pg-eye" type="button"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <!-- Eye open -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye closed -->
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <p class="pg-hint">This is the password you use to log in to your student portal.</p>
    </div>

    <!-- Footer -->
    <div class="pg-footer">
      <button class="pg-btn-cancel" type="button" (click)="dismiss()" [disabled]="isLoading">
        Cancel
      </button>
      <button class="pg-btn-verify" type="button" (click)="submit()" [disabled]="isLoading || !password">
        <span *ngIf="isLoading" class="pg-spinner" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Verifying…' : 'Verify &amp; View' }}</span>
      </button>
    </div>

  </div>
</div>
